# Octax Solobill behind a server's existing Traefik, with Nginx in between.
#   APP_DOMAIN=solobill.example.com docker compose -f compose.traefik.yml up -d
# See docs/SELF_HOSTING.md.
name: solobill

services:
  web:
    image: ghcr.io/octax-app/solobill:${SOLOBILL_VERSION:-latest}
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "3000"
      COOKIE_SECURE: "true"
    volumes:
      - data:/data
    networks:
      internal:
        aliases:
          - solobill-app
    # SQLite allows one writer, and invoice numbering relies on one process.
    # Never run more than one copy of this service.

  nginx:
    image: nginx:1-alpine
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-proxy}
      traefik.http.routers.solobill.rule: Host(`${APP_DOMAIN:?Set APP_DOMAIN to the domain that serves the app}`)
      traefik.http.routers.solobill.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.solobill.tls: "true"
      traefik.http.routers.solobill.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.solobill.service: solobill
      traefik.http.services.solobill.loadbalancer.server.port: "80"

volumes:
  data:
    name: ${SOLOBILL_DATA_VOLUME:-solobill_data}

networks:
  internal:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
