# Traefik handles HTTPS. This server passes requests on to the app.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  server_tokens off;

  # Slightly above the app's 20 MB limit, so the app returns its own error message.
  client_max_body_size 22m;

  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    # A variable makes Nginx look up the app per request, so it can start before the app does.
    # This alias is unique, because other projects on the proxy network may have a `web` service.
    set $app http://solobill-app:3000;
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # The app's cross-site check compares this with the browser's Origin.
    proxy_set_header Host $http_host;
  }
}
